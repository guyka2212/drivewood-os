# Drivewood lock screen (also the sign-in screen after boot)
general {
    hide_cursor = true
    ignore_empty_input = true
}
animations {
    enabled = true
    bezier = drift, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, drift
    animation = fadeOut, 1, 4, drift
}
background {
    monitor =
    path = $HOME/.local/state/drivewood/background
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
}
image {
    monitor =
    path = /usr/share/drivewood/logo.png
    size = 260
    rounding = 0
    border_size = 0
    position = 0, 170
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = rgba(230, 235, 240, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(154, 160, 180, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -50
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    rounding = 12
    inner_color = rgba(15, 17, 24, 0.85)
    outer_color = rgba(143, 180, 230, 0.9)
    check_color = rgba(106, 200, 220, 0.9)
    fail_color = rgba(232, 116, 106, 0.9)
    font_color = rgba(230, 235, 240, 1.0)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##7d7f8f">Password for $USER</span>
    fail_text = Wrong password
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -130
    halign = center
    valign = center
}
