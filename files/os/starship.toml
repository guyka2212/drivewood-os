# Driftwood prompt: a pine, where you are, git, slow-command timer, sky arrow.
add_newline = true
command_timeout = 200
format = "[ ](bold #9fc48a)$directory$git_branch$git_status$cmd_duration$character"

[character]
success_symbol = "[❯](bold #8fb4e6)"
error_symbol = "[❯](bold #e8746a)"

[directory]
style = "bold #e6dccb"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold #8fb4e6"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[ $branch]($style) "
style = "italic #86c4c0"

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "#86c4c0"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
modified = "! "
staged = "+ "
deleted = "✘ "
conflicted = "= "
stashed = ""
renamed = ""
up_to_date = ""

[cmd_duration]
min_time = 3000
format = "[ $duration]($style) "
style = "#7d7f8f"
