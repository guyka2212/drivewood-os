<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidepool</title>
<style>
  :root { --bg:#0b0d12; --fg:#cdd6f4; --dim:#6c7086; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; font:13px/1.5 ui-monospace,"JetBrainsMono Nerd Font",monospace; color:var(--fg); }
  #c { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; left:16px; bottom:16px; background:rgba(11,13,18,.72); border:1px solid #313244; padding:10px 14px; border-radius:6px; pointer-events:none; transition:opacity .4s; }
  #hud b { color:#a6e3a1; font-weight:600; }
  #hud .k { color:#f9e2af; }
  #title { font-size:15px; letter-spacing:.2em; color:#a6e3a1; margin-bottom:4px; }
  #stats { position:fixed; right:16px; top:12px; color:var(--dim); pointer-events:none; }
  #matrix { position:fixed; right:16px; bottom:16px; pointer-events:none; opacity:.85; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="title">TIDEPOOL</div>
  <div>life from <b id="nspecies">6</b> species and one rule table</div>
  <div><span class="k">R</span> new world &nbsp; <span class="k">M</span> mutate &nbsp; <span class="k">Space</span> pause</div>
  <div><span class="k">drag</span> stir &nbsp; <span class="k">right-drag</span> repel &nbsp; <span class="k">1-8</span> species &nbsp; <span class="k">H</span> hide</div>
</div>
<div id="stats"></div>
<canvas id="matrix" width="120" height="120"></canvas>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const mx = document.getElementById("matrix"), mctx = mx.getContext("2d");
const PALETTE = ["#f38ba8","#a6e3a1","#89b4fa","#f9e2af","#cba6f7","#94e2d5","#fab387","#f5c2e7"];
let W, H, N = 1300, S = 6, R_MAX = 80, FRICTION = 0.86, FORCE = 0.9;
let px, py, vx, vy, sp, rules, paused = false, seed = 0;

function rng(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener("resize", resize); resize();

function newWorld(keepRules){
  if (!keepRules){
    seed = (Math.random() * 1e9) | 0;
    const r = rng(seed);
    rules = [];
    for (let i = 0; i < S; i++){ rules.push([]); for (let j = 0; j < S; j++) rules[i].push(r() * 2 - 1); }
  }
  px = new Float32Array(N); py = new Float32Array(N); vx = new Float32Array(N); vy = new Float32Array(N); sp = new Uint8Array(N);
  for (let i = 0; i < N; i++){ px[i] = Math.random() * W; py[i] = Math.random() * H; sp[i] = i % S; }
  document.getElementById("nspecies").textContent = S;
  drawMatrix();
}

function mutate(){
  for (let i = 0; i < S; i++) for (let j = 0; j < S; j++)
    rules[i][j] = Math.max(-1, Math.min(1, rules[i][j] + (Math.random() - .5) * .5));
  drawMatrix();
}

function drawMatrix(){
  const c = mx.width / (S + 1);
  mctx.clearRect(0, 0, mx.width, mx.height);
  for (let i = 0; i < S; i++){
    mctx.fillStyle = PALETTE[i];
    mctx.fillRect(0, (i + 1) * c + 2, c - 4, c - 4);
    mctx.fillRect((i + 1) * c + 2, 0, c - 4, c - 4);
    for (let j = 0; j < S; j++){
      const v = rules[i][j];
      mctx.fillStyle = v > 0 ? `rgba(166,227,161,${v})` : `rgba(243,139,168,${-v})`;
      mctx.fillRect((j + 1) * c + 1, (i + 1) * c + 1, c - 2, c - 2);
    }
  }
}

// spatial hash
let cellSize, cols, rows, head, next;
function buildGrid(){
  cellSize = R_MAX; cols = Math.ceil(W / cellSize); rows = Math.ceil(H / cellSize);
  if (!head || head.length !== cols * rows) head = new Int32Array(cols * rows);
  if (!next || next.length !== N) next = new Int32Array(N);
  head.fill(-1);
  for (let i = 0; i < N; i++){
    const cx = Math.min(cols - 1, (px[i] / cellSize) | 0), cy = Math.min(rows - 1, (py[i] / cellSize) | 0);
    const k = cy * cols + cx; next[i] = head[k]; head[k] = i;
  }
}

const BETA = 0.3;
function force(r, a){ // r normalised 0..1
  if (r < BETA) return r / BETA - 1;                 // universal short-range repulsion
  if (r < 1) return a * (1 - Math.abs(2 * r - 1 - BETA) / (1 - BETA));
  return 0;
}

const mouse = { down:false, btn:0, x:0, y:0 };
cv.addEventListener("pointerdown", e => { mouse.down = true; mouse.btn = e.button; mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener("pointerup", () => mouse.down = false);
cv.addEventListener("contextmenu", e => e.preventDefault());

function step(){
  buildGrid();
  for (let i = 0; i < N; i++){
    let fx = 0, fy = 0;
    const xi = px[i], yi = py[i], row = rules[sp[i]];
    const cx = (xi / cellSize) | 0, cy = (yi / cellSize) | 0;
    for (let oy = -1; oy <= 1; oy++){
      let gy = cy + oy, wy = 0;
      if (gy < 0){ gy += rows; wy = -H; } else if (gy >= rows){ gy -= rows; wy = H; }
      for (let ox = -1; ox <= 1; ox++){
        let gx = cx + ox, wx = 0;
        if (gx < 0){ gx += cols; wx = -W; } else if (gx >= cols){ gx -= cols; wx = W; }
        for (let j = head[gy * cols + gx]; j !== -1; j = next[j]){
          if (j === i) continue;
          const dx = px[j] + wx - xi, dy = py[j] + wy - yi;
          const d2 = dx * dx + dy * dy;
          if (d2 > R_MAX * R_MAX || d2 === 0) continue;
          const d = Math.sqrt(d2), f = force(d / R_MAX, row[sp[j]]);
          fx += dx / d * f; fy += dy / d * f;
        }
      }
    }
    if (mouse.down){
      const dx = mouse.x - xi, dy = mouse.y - yi, d2 = dx * dx + dy * dy;
      if (d2 < 22500){ const s = (mouse.btn === 2 ? -1 : 1) * 4 / (Math.sqrt(d2) + 10); fx += dx * s; fy += dy * s; }
    }
    vx[i] = vx[i] * FRICTION + fx * FORCE;
    vy[i] = vy[i] * FRICTION + fy * FORCE;
  }
  for (let i = 0; i < N; i++){
    px[i] += vx[i]; py[i] += vy[i];
    if (px[i] < 0) px[i] += W; else if (px[i] >= W) px[i] -= W;
    if (py[i] < 0) py[i] += H; else if (py[i] >= H) py[i] -= H;
  }
}

function draw(){
  ctx.fillStyle = "rgba(11,13,18,0.28)";   // trails
  ctx.fillRect(0, 0, W, H);
  for (let s = 0; s < S; s++){
    ctx.fillStyle = PALETTE[s];
    for (let i = 0; i < N; i++) if (sp[i] === s) ctx.fillRect(px[i] - 1.5, py[i] - 1.5, 3, 3);
  }
}

let last = performance.now(), frames = 0, fps = 0;
function loop(t){
  if (!paused) step();
  draw();
  frames++;
  if (t - last > 1000){ fps = frames; frames = 0; last = t;
    document.getElementById("stats").textContent = `${N} particles · ${fps} fps · world #${seed.toString(36)}${paused ? " · paused" : ""}`; }
  requestAnimationFrame(loop);
}

addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "r") newWorld(false);
  else if (k === "m") mutate();
  else if (k === " "){ paused = !paused; e.preventDefault(); }
  else if (k === "h"){ const h = document.getElementById("hud"); h.style.opacity = h.style.opacity === "0" ? "1" : "0"; }
  else if (k >= "1" && k <= "8"){ S = Math.max(2, +k); newWorld(false); }
});

newWorld(false);
requestAnimationFrame(loop);
</script>
</body>
</html>
